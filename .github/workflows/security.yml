name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC security sweep
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit + build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bramka dotyczy wyłącznie zależności runtime. Ten pakiet publikuje sam
      # `dist` i ma ZERO `dependencies`, więc podatność w narzędziu buildu
      # (vite, esbuild, rollup) nie dociera do nikogo, kto instaluje SDK.
      # Bez `--omit=dev` job zatrzymywał się tutaj i type-check, build oraz
      # testy nigdy się nie wykonywały.
      - name: Audit runtime dependencies (fail on high)
        run: npm audit --omit=dev --audit-level=high

      # Podatności w narzędziach buildu nadal chcemy widzieć: skompromitowany
      # bundler mógłby wstrzyknąć kod do publikowanego `dist`. Raportujemy je,
      # ale nie blokujemy nimi wydania.
      - name: Audit build tooling (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
